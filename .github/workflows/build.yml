name: Build All GKI
on:
  push:
  workflow_dispatch:

jobs:
  build-rust:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:android16-6.12-20260313
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Build Rust runtime
        run: |
          KDIR=/opt/ddk/kdir/android16-6.12 VER=android16-6.12 SKIP_RUST_FMT=1 ./scripts/build-rust.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rust-runtime
          include-hidden-files: true
          path: |
            out/android16-6.12/rust
            src/exports_rust_generated.h

  build-matrix:
    needs: build-rust
    strategy:
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260313
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rust-runtime
          path: rust-artifact
      - name: Fetch deps
        run: |
          git clone https://github.com/Dere3046/KMSDK.git .sdk
          git -C .sdk checkout "$(cat .sdk-version)"
          ./scripts/fetch-deps.sh
      - name: Prepare Rust artifacts
        run: |
          mkdir -p "out/${{ matrix.kmi }}/rust"
          cp -a rust-artifact/out/android16-6.12/rust/. "out/${{ matrix.kmi }}/rust/"
          case "${{ matrix.kmi }}" in
            android12-5.10|android13-5.10|android13-5.15|android14-5.15)
              SHORT_ALIAS=1
              MAX=0
              ;;
            *)
              MAX=0
              SHORT_ALIAS=0
              ;;
          esac
          if [ "${{ matrix.kmi }}" = "android16-6.12" ]; then
            SKIP=1
          else
            SKIP=0
          fi
          echo "SKIP_RUST_HELPERS=$SKIP" >> "$GITHUB_ENV"
          echo "SHORT_ALIAS=$SHORT_ALIAS" >> "$GITHUB_ENV"
          OUT=src/exports_rust_generated.h MAX_SYMBOL_LEN=$MAX SKIP_RUST_FMT=$SKIP \
            SHORT_ALIAS=$SHORT_ALIAS ALIAS_MAP="out/${{ matrix.kmi }}/rust_sym_map.txt" \
            scripts/gen-exports.sh \
            "out/${{ matrix.kmi }}/rust/core.o" \
            "out/${{ matrix.kmi }}/rust/compiler_builtins.o" \
            "out/${{ matrix.kmi }}/rust/rust_support_rust.o"
      - name: Build
        run: |
          if [ "$SHORT_ALIAS" = "1" ]; then
            ./scripts/apply-aliases.sh "out/${{ matrix.kmi }}/rust_sym_map.txt" \
              "out/${{ matrix.kmi }}/rust/core.o" \
              "out/${{ matrix.kmi }}/rust/compiler_builtins.o" \
              "out/${{ matrix.kmi }}/rust/rust_support_rust.o"
          fi
          case "${{ matrix.kmi }}" in
            android14-6.1|android15-6.6|android16-6.12)
              make VER=${{ matrix.kmi }} \
                MODPOST="$PWD/scripts/fix-modpost-wrapper.sh" \
                REAL_MODPOST="/opt/ddk/kdir/${{ matrix.kmi }}/scripts/mod/modpost"
              ;;
            *)
              make VER=${{ matrix.kmi }}
              ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: rust_support-${{ matrix.kmi }}
          include-hidden-files: true
          path: |
            out/${{ matrix.kmi }}/rust_support.ko
            out/${{ matrix.kmi }}/Module.symvers
            out/${{ matrix.kmi }}/rust_sym_map.txt
            out/${{ matrix.kmi }}/rust
